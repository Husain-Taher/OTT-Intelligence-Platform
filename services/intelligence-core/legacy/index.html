<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTT Intelligence Platform | Preference Intelligence & Discovery</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: "#05060A",
            surface: {
              DEFAULT: "#0D0F18",
              elevated: "#141724",
              subtle: "#1B1F33",
            },
            accent: {
              DEFAULT: "#6366F1",
              glow: "#818CF8",
              amber: "#F59E0B",
              cyan: "#06B6D4",
              emerald: "#10B981",
              rose: "#F43F5E"
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel for zero-build resilience -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #030408;
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      letter-spacing: -0.01em;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #030408; }
    ::-webkit-scrollbar-thumb { background: #1C2237; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #39426B; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.22; transform: scale(1) translateY(0); }
      50% { opacity: 0.42; transform: scale(1.06) translateY(-8px); }
    }
    .ambient-aurora {
      animation: pulseGlow 12s ease-in-out infinite;
    }

    @keyframes cinematicBeam {
      0% { transform: rotate(-7deg) translateX(-12%); opacity: 0.12; }
      50% { transform: rotate(7deg) translateX(12%); opacity: 0.32; }
      100% { transform: rotate(-7deg) translateX(-12%); opacity: 0.12; }
    }
    .cinematic-beam {
      animation: cinematicBeam 18s ease-in-out infinite;
    }

    .theater-glow {
      box-shadow: 0 0 70px -10px rgba(99, 102, 241, 0.32), 0 0 30px -5px rgba(245, 158, 11, 0.15);
    }
    .theater-glow-gold {
      box-shadow: 0 0 60px -10px rgba(245, 158, 11, 0.35);
    }

    .glass-card {
      background: linear-gradient(145deg, rgba(16, 20, 34, 0.82) 0%, rgba(8, 10, 18, 0.92) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 16px 40px -10px rgba(99, 102, 241, 0.25), 0 0 20px -2px rgba(245, 158, 11, 0.18);
    }

    .shimmer-text {
      background: linear-gradient(90deg, #FFFFFF 0%, #FDE68A 25%, #C7D2FE 60%, #FFFFFF 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 7s linear infinite;
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = "/v1";

    // --- MAIN APPLICATION ---
    function App() {
      const [activeTab, setActiveTab] = useState("discover");
      const [deck, setDeck] = useState(null);
      const [allContent, setAllContent] = useState([]);
      const [selectedTitle, setSelectedTitle] = useState(null);
      const [activeTrailerKey, setActiveTrailerKey] = useState(null);
      const [tasteProfile, setTasteProfile] = useState(null);
      const [tasteUniverse, setTasteUniverse] = useState(null);
      const [peopleHub, setPeopleHub] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [watchlist, setWatchlist] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);
      const [showCalibrationModal, setShowCalibrationModal] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [currentUser, setCurrentUser] = useState({
        user_id: localStorage.getItem("ott_user_id") || "default_user",
        username: localStorage.getItem("ott_username") || "Cinephile Pioneer",
        token: localStorage.getItem("ott_token") || null
      });
      const [isTrainingML, setIsTrainingML] = useState(false);

      useEffect(() => {
        loadDeck();
        loadAllContent();
        loadTasteData(currentUser.user_id);
        loadPeopleHub();
        loadUserProfile(currentUser.user_id);
        loadWatchlist(currentUser.user_id);
      }, [currentUser.user_id]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const loadDeck = async () => {
        try {
          const res = await fetch(`${API_BASE}/discover?user_id=${currentUser.user_id}`);
          setDeck(await res.json());
        } catch (e) {
          console.error(e);
        }
      };

      const loadAllContent = async () => {
        try {
          const res = await fetch(`${API_BASE}/content`);
          setAllContent(await res.json());
        } catch (e) {
          console.error(e);
        }
      };

      const loadTasteData = async (uid = currentUser.user_id) => {
        try {
          const [pRes, uRes] = await Promise.all([
            fetch(`${API_BASE}/profile/taste?user_id=${uid}`),
            fetch(`${API_BASE}/profile/taste-universe?user_id=${uid}`)
          ]);
          setTasteProfile(await pRes.json());
          setTasteUniverse(await uRes.json());
        } catch (e) {
          console.error(e);
        }
      };

      const loadPeopleHub = async () => {
        try {
          const res = await fetch(`${API_BASE}/people`);
          setPeopleHub(await res.json());
        } catch (e) {
          console.error(e);
        }
      };

      const loadUserProfile = async (uid = currentUser.user_id) => {
        try {
          const res = await fetch(`${API_BASE}/user/profile?user_id=${uid}`);
          setUserProfile(await res.json());
        } catch (e) {
          console.error(e);
        }
      };

      const loadWatchlist = async (uid = currentUser.user_id) => {
        try {
          const res = await fetch(`${API_BASE}/user/watchlist?user_id=${uid}`);
          const data = await res.json();
          setWatchlist(data.items || []);
        } catch (e) {
          console.error(e);
        }
      };

      const handleToggleWatchlist = async (contentId, titleName) => {
        try {
          const res = await fetch(`${API_BASE}/user/watchlist/toggle`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content_id: contentId, user_id: currentUser.user_id })
          });
          const data = await res.json();
          showToast(data.is_saved ? `Saved to Watchlist: ${titleName}` : `Removed from Watchlist: ${titleName}`);
          loadWatchlist();
          loadUserProfile();
          loadTasteData();
        } catch (e) {
          console.error(e);
        }
      };

      const handleEventLogged = () => {
        loadTasteData();
        loadDeck();
        loadUserProfile();
        loadWatchlist();
      };

      const handleTriggerMLTraining = async () => {
        setIsTrainingML(true);
        try {
          const res = await fetch(`${API_BASE}/ml/train-user`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: currentUser.user_id })
          });
          const data = await res.json();
          showToast(`ML Pipeline: Synthesized ${data.ml_training_result?.events_processed || 0} behavioral events! Archetype: ${data.ml_training_result?.archetype}`);
          loadTasteData();
          loadUserProfile();
          loadDeck();
        } catch (e) {
          console.error(e);
          showToast("ML Pipeline execution failed");
        }
        setIsTrainingML(false);
      };

      const handleUserAuthenticated = (userObj) => {
        localStorage.setItem("ott_user_id", userObj.user_id);
        localStorage.setItem("ott_username", userObj.username);
        if (userObj.access_token) {
          localStorage.setItem("ott_token", userObj.access_token);
        }
        setCurrentUser({
          user_id: userObj.user_id,
          username: userObj.username,
          token: userObj.access_token || null
        });
        showToast(`Welcome back, ${userObj.username}! Personal vectors loaded.`);
        setShowAuthModal(false);
      };

      const handleSignOut = () => {
        localStorage.removeItem("ott_user_id");
        localStorage.removeItem("ott_username");
        localStorage.removeItem("ott_token");
        setCurrentUser({
          user_id: "default_user",
          username: "Cinephile Pioneer",
          token: null
        });
        showToast("Signed out. Switched to Guest Profile.");
      };

      return (
        <div className="min-h-screen flex flex-col relative bg-[#030408] text-slate-100">
          {/* Flagship Theater Atmosphere Lights */}
          <div className="fixed top-0 left-1/4 -translate-x-1/2 w-[600px] h-[500px] bg-[radial-gradient(circle,rgba(99,102,241,0.22)_0%,transparent_70%)] pointer-events-none ambient-aurora filter blur-3xl" />
          <div className="fixed top-10 right-1/4 translate-x-1/2 w-[550px] h-[450px] bg-[radial-gradient(circle,rgba(244,63,94,0.15)_0%,transparent_70%)] pointer-events-none ambient-aurora filter blur-3xl" style={{ animationDelay: '-4s' }} />
          <div className="fixed top-0 left-1/2 -translate-x-1/2 w-full h-[700px] bg-[radial-gradient(ellipse_at_top,rgba(16,185,129,0.08)_0%,transparent_75%)] pointer-events-none filter blur-2xl" />
          <div className="fixed -top-40 left-1/2 -translate-x-1/2 w-[900px] h-[350px] bg-gradient-to-b from-indigo-500/15 via-purple-500/10 to-transparent pointer-events-none cinematic-beam filter blur-2xl" />

          {/* Navigation Bar */}
          <header className="sticky top-0 z-40 w-full border-b border-white/[0.08] bg-[#030408]/85 backdrop-blur-2xl transition-all">
            <div className="mx-auto flex h-18 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8 py-2">
              
              {/* Logo / Brand */}
              <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setActiveTab("discover")}>
                <div className="relative flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-amber-400 via-indigo-600 to-rose-600 p-[1.5px] shadow-2xl shadow-indigo-500/30 group-hover:scale-105 transition-transform duration-300">
                  <div className="h-full w-full bg-[#070913] rounded-2xl flex items-center justify-center">
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-indigo-300 to-white text-xl font-black">✦</span>
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black tracking-widest text-white text-sm sm:text-base shimmer-text font-display">OTT INTELLIGENCE</span>
                    <span className="flex h-2 w-2 rounded-full bg-emerald-400 animate-pulse shadow-lg shadow-emerald-400/50" />
                  </div>
                  <p className="text-[10px] text-indigo-300/80 tracking-widest uppercase font-bold flex items-center gap-1.5">
                    <span>FLAGSHIP PREFERENCE ENGINE</span>
                    <span className="text-white/30">•</span>
                    <span className="text-amber-400 font-extrabold">GLOBAL CINEMA</span>
                  </p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center gap-1 sm:gap-2">
                {[
                  { id: "discover", label: "Discover", badge: null },
                  { id: "find-my-watch", label: "Find My Watch", badge: "SIGNATURE" },
                  { id: "people", label: "Stars & Directors", badge: "AUTEURS" },
                  { id: "taste-universe", label: "Taste Universe", badge: "GALAXY" },
                  { id: "profile", label: "My Profile", badge: watchlist.length > 0 ? `${watchlist.length}` : null },
                  { id: "search", label: "Intent Search", badge: null },
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`relative flex items-center gap-2 rounded-xl px-3.5 py-2 text-xs font-semibold transition-all ${
                      activeTab === item.id
                        ? "bg-white/[0.08] text-white shadow-inner border border-white/[0.12]"
                        : "text-slate-400 hover:bg-white/[0.04] hover:text-slate-200"
                    }`}
                  >
                    <span>{item.label}</span>
                    {item.badge && (
                      <span className="rounded-full bg-indigo-500/20 px-2 py-0.5 text-[9px] font-bold text-indigo-300 border border-indigo-500/30">
                        {item.badge}
                      </span>
                    )}
                    {activeTab === item.id && (
                      <span className="absolute bottom-0 left-3 right-3 h-[2px] bg-gradient-to-r from-indigo-500 to-cyan-400 rounded-full" />
                    )}
                  </button>
                ))}
              </nav>

              {/* ML Training Pipeline & Auth Controls */}
              <div className="flex items-center gap-2.5">
                {/* Master ML Continuous Training Button */}
                <button
                  onClick={handleTriggerMLTraining}
                  disabled={isTrainingML}
                  title="Run continuous ML learning loop on historical events"
                  className="hidden md:flex items-center gap-1.5 border border-emerald-500/30 bg-emerald-500/10 hover:bg-emerald-500/20 px-3 py-1.5 rounded-full text-xs font-semibold text-emerald-300 transition-all hover:scale-102 disabled:opacity-50"
                >
                  <span className={isTrainingML ? "animate-spin inline-block" : "inline-block"}>⚙</span>
                  <span>{isTrainingML ? "Training ML Model..." : "Train ML Model"}</span>
                  <span className="text-[9px] bg-emerald-500/30 text-emerald-200 px-1.5 py-0.2 rounded font-black">AI</span>
                </button>

                {/* Archetype / Taste Calibration Trigger */}
                <button
                  onClick={() => setShowCalibrationModal(true)}
                  className="flex items-center gap-2 border border-indigo-500/30 bg-indigo-500/10 hover:bg-indigo-500/20 px-3.5 py-1.5 rounded-full transition-all group"
                >
                  <div className="h-2 w-2 rounded-full bg-indigo-400 group-hover:scale-125 transition-transform" />
                  <span className="text-xs text-indigo-200 font-semibold hidden sm:inline">Calibrate Taste</span>
                  <span className="text-[10px] text-indigo-300 font-bold bg-indigo-500/30 px-1.5 py-0.2 rounded">ML</span>
                </button>

                {/* User Auth Profile Trigger */}
                {currentUser.token ? (
                  <div className="flex items-center gap-2 bg-white/[0.04] border border-white/10 rounded-full pl-2.5 pr-1 py-1">
                    <span className="text-xs font-bold text-amber-300 truncate max-w-[90px] sm:max-w-[130px]">
                      {currentUser.username}
                    </span>
                    <button
                      onClick={handleSignOut}
                      className="text-[10px] bg-white/10 hover:bg-white/20 px-2 py-0.5 rounded-full text-slate-300 hover:text-white transition-colors"
                      title="Sign Out"
                    >
                      Sign Out
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setShowAuthModal(true)}
                    className="flex items-center gap-1.5 rounded-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black px-3.5 py-1.5 text-xs shadow-lg shadow-amber-500/20 transition-all hover:scale-105"
                  >
                    <span>Sign In / Sign Up</span>
                  </button>
                )}
              </div>

            </div>
          </header>

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 rounded-xl bg-indigo-600 px-4 py-3 text-xs font-semibold text-white shadow-2xl border border-indigo-400/40 flex items-center gap-2 animate-bounce">
              <span>✓</span>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Main Workspace Area */}
          <main className="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8 py-8 flex-1 relative z-10">
            {activeTab === "discover" && (
              <DiscoverView
                deck={deck}
                allContent={allContent}
                watchlist={watchlist}
                onSelectTitle={setSelectedTitle}
                onPlayTrailer={setActiveTrailerKey}
                onToggleWatchlist={handleToggleWatchlist}
                onOpenFindMyWatch={() => setActiveTab("find-my-watch")}
              />
            )}
            {activeTab === "find-my-watch" && (
              <FindMyWatchView
                watchlist={watchlist}
                onSelectTitle={setSelectedTitle}
                onPlayTrailer={setActiveTrailerKey}
                onToggleWatchlist={handleToggleWatchlist}
              />
            )}
            {activeTab === "people" && (
              <PeopleHubView
                peopleHub={peopleHub}
                onSelectTitle={setSelectedTitle}
                onPlayTrailer={setActiveTrailerKey}
              />
            )}
            {activeTab === "taste-universe" && (
              <TasteUniverseComponent
                universe={tasteUniverse}
                profile={tasteProfile}
                onSelectTitle={setSelectedTitle}
                onPlayTrailer={setActiveTrailerKey}
                onClusterTuned={loadTasteData}
              />
            )}
            {activeTab === "profile" && (
              <ProfileAndWatchlistView
                userProfile={userProfile}
                tasteProfile={tasteProfile}
                watchlist={watchlist}
                isTrainingML={isTrainingML}
                onTriggerMLTraining={handleTriggerMLTraining}
                onSelectTitle={setSelectedTitle}
                onPlayTrailer={setActiveTrailerKey}
                onToggleWatchlist={handleToggleWatchlist}
                onOpenCalibration={() => setShowCalibrationModal(true)}
              />
            )}
            {activeTab === "search" && (
              <SearchView
                watchlist={watchlist}
                onSelectTitle={setSelectedTitle}
                onPlayTrailer={setActiveTrailerKey}
                onToggleWatchlist={handleToggleWatchlist}
              />
            )}
          </main>

          {/* Video Trailer Theater Modal */}
          {activeTrailerKey && (
            <TrailerTheaterModal
              trailerKey={activeTrailerKey}
              onClose={() => setActiveTrailerKey(null)}
            />
          )}

          {/* Why Should I Watch This Modal with Story Card & Gallery Tabs */}
          {selectedTitle && (
            <WhyModal
              content={selectedTitle}
              isSaved={watchlist.some(w => w.content_id === selectedTitle.content_id)}
              onClose={() => setSelectedTitle(null)}
              onPlayTrailer={setActiveTrailerKey}
              onToggleWatchlist={() => handleToggleWatchlist(selectedTitle.content_id, selectedTitle.title)}
              onEventLogged={(label) => {
                showToast(`Recorded: ${label}`);
                handleEventLogged();
              }}
            />
          )}

          {/* Taste Calibration & Archetype Modal */}
          {showCalibrationModal && (
            <TasteCalibrationModal
              onClose={() => setShowCalibrationModal(false)}
              onArchetypeSelected={(name) => {
                showToast(`Taste Profile Calibrated: ${name}`);
                setShowCalibrationModal(false);
                handleEventLogged();
              }}
            />
          )}

          {/* User Sign In / Registration Modal */}
          {showAuthModal && (
            <AuthModal
              onClose={() => setShowAuthModal(false)}
              onSuccess={handleUserAuthenticated}
            />
          )}
        </div>
      );
    }

    // --- 1. DISCOVER VIEW (Section 29) ---
    function DiscoverView({ deck, allContent, watchlist, onSelectTitle, onPlayTrailer, onToggleWatchlist, onOpenFindMyWatch }) {
      const [activeCategory, setActiveCategory] = useState("all");

      if (!deck) {
        return (
          <div className="flex h-96 items-center justify-center text-slate-400">
            <span className="text-sm font-semibold tracking-wider animate-pulse">Synthesizing live entertainment discovery deck...</span>
          </div>
        );
      }

      const hero = deck.hero;

      const filteredGrid = allContent.filter(item => {
        if (activeCategory === "all") return true;
        if (activeCategory === "scifi") return item.genres.includes("Science Fiction");
        if (activeCategory === "bollywood") return item.origin_countries.includes("IN") || ["hi", "ta", "te", "kn", "ml"].includes(item.original_language);
        if (activeCategory === "thriller") return item.genres.includes("Thriller") || item.genres.includes("Mystery");
        if (activeCategory === "drama") return item.genres.includes("Drama") || item.genres.includes("Romance");
        if (activeCategory === "action") return item.genres.includes("Action") || item.genres.includes("Adventure");
        if (activeCategory === "comfort") return item.genres.includes("Comedy") || item.genres.includes("Family") || item.genres.includes("Animation");
        if (activeCategory === "international") return !["US", "GB"].includes(item.origin_countries[0]);
        if (activeCategory === "series") return item.content_type === "series";
        return true;
      });

      return (
        <div className="space-y-12">
          {/* Header Experience Prompt Buttons */}
          <div className="rounded-2xl border border-white/[0.08] bg-surface p-6 sm:p-8">
            <div className="flex justify-between items-start">
              <div>
                <h1 className="text-xs font-bold uppercase tracking-widest text-indigo-400">Good Evening</h1>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-white mt-1">
                  What kind of experience are you looking for?
                </h2>
              </div>
              <div className="hidden sm:block text-right">
                <span className="text-xs font-bold text-slate-300">{deck.total_catalog_size || 97} Master Titles</span>
                <p className="text-[10px] text-slate-500 uppercase">Live Global Feed</p>
              </div>
            </div>

            <div className="mt-5 flex flex-wrap gap-2">
              {[
                "I want to feel something",
                "I want a mystery",
                "Surprise me",
                "Something comforting",
                "Intellectually intense",
                "I have 90 minutes"
              ].map((label, i) => (
                <button
                  key={i}
                  onClick={onOpenFindMyWatch}
                  className="rounded-xl border border-white/[0.1] bg-white/[0.03] px-3.5 py-2 text-xs font-medium text-slate-200 hover:border-indigo-500/40 hover:bg-indigo-500/10 hover:text-white transition-all shadow-sm"
                >
                  [ {label} ]
                </button>
              ))}
              <button
                onClick={onOpenFindMyWatch}
                className="rounded-xl border border-indigo-500/40 bg-gradient-to-r from-indigo-600/30 to-indigo-500/20 px-4 py-2 text-xs font-bold text-indigo-200 hover:from-indigo-600/50 hover:to-indigo-500/40 transition-all shadow-sm"
              >
                [ I don't know what I want → ]
              </button>
            </div>
          </div>

          {/* Hero Recommendation */}
          {hero && (
            <div className="space-y-3">
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-bold tracking-wider text-slate-400 uppercase">
                  YOUR NIGHT • HERO RECOMMENDATION
                </h3>
                <span className="text-xs font-bold text-emerald-400">
                  {hero.personal_match_percentage}% Personal Match
                </span>
              </div>

              <div className="relative overflow-hidden rounded-3xl border border-white/[0.15] bg-surface shadow-2xl group theater-glow">
                <div className="relative aspect-[21/9] min-h-[380px] w-full overflow-hidden">
                  <img
                    src={hero.content.backdrop_path || hero.content.poster_path}
                    alt={hero.content.title}

    // --- 3. STARS & DIRECTORS AUTEURS EXPLORER (WITH LIVE ONLINE PERSON DISCOVERY) ---
    function PeopleHubView({ peopleHub, onSelectTitle, onPlayTrailer }) {
      const [filterType, setFilterType] = useState("directors");
      const [selectedPerson, setSelectedPerson] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [searchResults, setSearchResults] = useState(null);
      const [isSearching, setIsSearching] = useState(false);

      if (!peopleHub) {
        return <div className="text-center py-20 text-slate-400">Loading Stars & Directors Hub...</div>;
      }

      const handlePersonSearch = async (q) => {
        const queryToRun = (q !== undefined ? q : searchQuery).trim();
        if (!queryToRun) {
          setSearchResults(null);
          return;
        }
        setIsSearching(true);
        try {
          const res = await fetch(`${API_BASE}/people/search?query=${encodeURIComponent(queryToRun)}`);
          const data = await res.json();
          setSearchResults(data.results || []);
          if (data.results?.length > 0) {
            setSelectedPerson(data.results[0]);
          }
        } catch (e) {
          console.error("Person search error:", e);
        }
        setIsSearching(false);
      };

      const clearSearch = () => {
        setSearchQuery("");
        setSearchResults(null);
        setSelectedPerson(null);
      };

      const activeList = searchResults !== null 
        ? searchResults 
        : (filterType === "directors" ? peopleHub.directors : peopleHub.stars);

      const spotlightRef = React.useRef(null);

      const handleSelectPerson = (person) => {
        setSelectedPerson(person);
        setTimeout(() => {
          if (spotlightRef.current) {
            spotlightRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 50);
      };

      return (
        <div className="space-y-8">
          {/* Main Creator Hub Header & Live Search Bar */}
          <div className="rounded-3xl border border-white/[0.1] bg-gradient-to-b from-[#101426] via-[#0A0D18] to-surface p-6 sm:p-8 shadow-2xl relative overflow-hidden">

                <div className="flex items-center gap-2 mb-1">
                  <span className="flex h-2 w-2 rounded-full bg-amber-400 animate-pulse" />
                  <span className="text-xs font-black tracking-widest text-amber-400 uppercase">
                    Creator & Auteur Intelligence Engine
                  </span>
                </div>

                <p className="mt-1 text-sm text-slate-300 max-w-2xl leading-relaxed">
                  Search any actor, auteur, or filmmaker globally. Explore their full filmographies ranked by viewer rating with instant trailer theater previews.
                </p>
              </div>

              {/* Filter Tabs */}
              <div className="flex gap-2 bg-black/60 p-1.5 rounded-2xl border border-white/10 shrink-0">
                <button

    // --- 4. TASTE UNIVERSE (Section 33 - WORKING INTERACTIVE GALAXY) ---
    function TasteUniverseComponent({ universe, profile, onSelectTitle, onPlayTrailer, onClusterTuned }) {
      const [selectedCluster, setSelectedCluster] = useState(null);
      const [clusterWeight, setClusterWeight] = useState(0.8);

      useEffect(() => {
        if (universe?.clusters?.length) {
          setSelectedCluster(universe.clusters[0]);
          setClusterWeight(universe.clusters[0].weight);
        }
      }, [universe]);

      const handleSelectCluster = (c) => {
        setSelectedCluster(c);
        setClusterWeight(c.weight);
      };

      const handleTuneSlider = async (newVal) => {
        setClusterWeight(newVal);
        if (!selectedCluster) return;
        try {
          await fetch(`${API_BASE}/profile/tune-cluster`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cluster_id: selectedCluster.id, weight: newVal })
          });
          onClusterTuned();
        } catch (e) {
          console.error(e);
        }
      };

      if (!universe || !profile) {
        return <div className="text-center py-20 text-slate-400">Loading Taste Universe...</div>;
      }

      return (
        <div className="space-y-8">
          <div className="rounded-2xl border border-white/[0.08] bg-surface p-6 sm:p-8">
            <div className="flex justify-between items-start">
              <div>
                <span className="text-xs font-bold tracking-widest text-indigo-400 uppercase">
                  Living Preference Galaxy
                </span>
                <h1 className="text-3xl font-extrabold text-white mt-1">Taste Universe</h1>
                <p className="mt-1 text-sm text-slate-400 max-w-2xl leading-relaxed">
                  Your taste is not a flat genre tag. Click on any cluster node to reveal orbiting titles, adjust gravity parameters, and recalibrate your recommendation weights.
                </p>
              </div>
              <div className="text-right">
                <span className="text-xs font-bold text-emerald-400">6 Live Cluster Constellations</span>
                <p className="text-[10px] text-slate-500 uppercase">{profile.interaction_count} Events Recorded</p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 relative aspect-[4/3] rounded-2xl border border-white/[0.08] bg-[#05060A] overflow-hidden flex items-center justify-center p-6 shadow-2xl">
              <svg className="h-full w-full max-h-[480px]" viewBox="-200 -200 400 400">
                <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(255,255,255,0.04)" strokeDasharray="4 4" />
                <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(255,255,255,0.06)" />
                <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(255,255,255,0.08)" />

                {universe.clusters.map((c, i) => {
                  const next = universe.clusters[(i + 1) % universe.clusters.length];
                  return (
                    <line
                      key={i}
                      x1={c.x}
                      y1={c.y}
                      x2={next.x}
                      y2={next.y}
                      stroke="rgba(99, 102, 241, 0.25)"
                      strokeWidth="1.5"
                    />
                  );
                })}

                {universe.clusters.map((c) => {
                  const isSelected = selectedCluster?.id === c.id;
                  const radius = 14 + (c.weight * 16);
                  return (
                    <g
                      key={c.id}
                      onClick={() => handleSelectCluster(c)}
                      className="cursor-pointer transition-transform hover:scale-110"
                    >
                      <circle
                        cx={c.x}
                        cy={c.y}
                        r={radius + (isSelected ? 14 : 8)}
                        fill={c.color}
                        opacity={isSelected ? "0.35" : "0.1"}
                      />
                      <circle
                        cx={c.x}
                        cy={c.y}
                        r={radius}
                        fill={c.color}
                        stroke="#ffffff"
                        strokeWidth={isSelected ? "3" : "0.5"}
                        opacity="0.9"
                      />
                      <text
                        x={c.x}
                        y={c.y + radius + 14}
                        textAnchor="middle"
                        fill="#F1F5F9"
                        fontSize="11"
                        fontWeight="600"
                      >
                        {c.name}
                      </text>
                      <text
                        x={c.x}
                        y={c.y + 4}
                        textAnchor="middle"
                        fill="#ffffff"
                        fontSize="10"
                        fontWeight="bold"
                      >
                        {Math.round(c.weight * 100)}%
                      </text>
                    </g>
                  );
                })}
              </svg>
            </div>

            <div className="rounded-2xl border border-white/[0.08] bg-surface p-6 flex flex-col justify-between shadow-2xl">
              <div>
                <span className="text-[10px] font-bold tracking-widest text-indigo-400 uppercase">
                  Active Constellation Focus
                </span>
                <h3 className="text-2xl font-bold text-white mt-1">
                  {selectedCluster ? selectedCluster.name : "Select a Cluster"}
                </h3>
                <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                  {selectedCluster?.tagline || "Click any node on the left to inspect its orbital pull."}
                </p>

                <div className="mt-6 p-4 rounded-xl bg-white/[0.02] border border-white/[0.08]">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-semibold text-slate-300">Cluster Gravity Pull</span>
                    <span className="text-xs font-bold text-indigo-400">{Math.round(clusterWeight * 100)}%</span>
                  </div>
                  <input
                    type="range"
                    min="0.1"
                    max="1.0"
                    step="0.05"
                    value={clusterWeight}
                    onChange={(e) => handleTuneSlider(Number(e.target.value))}
                    className="w-full accent-indigo-500 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-500 mt-1">
                    <span>Downweight</span>
                    <span>Dominant Gravity</span>
                  </div>
                </div>

                <div className="mt-6 space-y-3">
                  <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                    <span>Orbiting Master Titles</span>
                    <span className="text-[10px] text-indigo-400">{selectedCluster?.orbit_titles?.length || 0} In Gravitational Pull</span>
                  </h4>

                  <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                    {selectedCluster?.orbit_titles?.map((orb) => (
                      <div
                        key={orb.content.content_id}
                        onClick={() => onSelectTitle(orb.content)}
                        className="flex items-center justify-between p-2 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] border border-white/[0.05] cursor-pointer transition-colors"
                      >
                        <div className="flex items-center gap-2">
                          <img
                            src={orb.content.poster_path || orb.content.backdrop_path}
                            alt=""
                            className="h-9 w-6 object-cover rounded"
                          />
                          <div className="flex-1 min-w-0 pr-2">
                            <h5 className="text-xs font-bold text-slate-200 line-clamp-2 leading-tight break-words">{orb.content.title}</h5>
                            <span className="text-[10px] text-slate-400 mt-0.5 block">{orb.content.release_year} • {orb.content.genres?.[0]}</span>
                          </div>
                        </div>

                        <div className="flex items-center gap-2 shrink-0">
                          <span className="text-xs font-bold text-emerald-400">{orb.personal_match_percentage}%</span>
                          {orb.content.trailer_key && (
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                onPlayTrailer(orb.content.trailer_key);
                              }}
                              className="text-[10px] bg-white/10 hover:bg-white/20 px-2 py-1 rounded text-white font-semibold"
                            >
                              ▶
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="mt-6 pt-4 border-t border-white/[0.08] text-[11px] text-slate-500 flex items-center justify-between">
                <span>Model Calibration Version:</span>
                <span className="font-bold text-slate-300">v2.1 Real-Time</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

      const [data, setData] = useState(null);

      const handleSearch = async (qText) => {
        const active = qText || query;
        if (!active.trim()) return;
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/search?query=${encodeURIComponent(active)}`, { method: "POST" });
          setData(await res.json());
        } catch (e) {
          console.error(e);
        }
        setLoading(false);
      };

      return (
        <div className="space-y-8">
          <div className="rounded-2xl border border-white/[0.08] bg-surface p-6 sm:p-8">

            <p className="mt-1 text-sm text-slate-400 max-w-2xl leading-relaxed">
              Ask for cinematic qualities, emotional tones, negative constraints, and thematic comparisons rather than keywords.
            </p>

            <div className="mt-6 flex flex-col sm:flex-row gap-2">
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && handleSearch()}
                className="w-full rounded-xl border border-white/10 bg-[#05060A] px-4 py-3 text-sm text-white placeholder-slate-500 focus:border-indigo-500 focus:outline-none"
              />
              <button
                onClick={() => handleSearch()}
                disabled={loading}
                className="rounded-xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors"
              >
                {loading ? "Parsing..." : "Search"}

            </div>

                "something like Dark but less confusing",
                "Christopher Nolan masterpieces",
                "90 minute mystery with atmosphere",
                "comforting movie for two people"
              ].map((sample, i) => (
                <button
                  key={i}
                  onClick={() => {
                    setQuery(sample);
                    handleSearch(sample);
                  }}
                  className="rounded-lg bg-white/[0.04] px-2.5 py-1 text-xs text-slate-300 hover:bg-white/[0.08] border border-white/[0.06]"

                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 4: VISUAL STILLS GALLERY (NEW!) */}
              {modalTab === "gallery" && (
                <div className="space-y-4">
                  <h4 className="text-xs font-bold text-slate-400 uppercase">High-Resolution Cinematic Stills</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {content.gallery_images?.length > 0 ? (
                      content.gallery_images.map((imgUrl, i) => (
                        <div key={i} className="rounded-xl overflow-hidden border border-white/10 aspect-video bg-slate-900 shadow-lg">
                          <img src={imgUrl} alt="Cinematic Still" className="h-full w-full object-cover hover:scale-105 transition-transform duration-500" />
                        </div>
                      ))
                    ) : (
                      <div className="col-span-2 text-center py-10 text-slate-500 text-xs">
                        No additional backdrops available in feed.
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Available on Providers */}
              <div className="flex items-center justify-between border-t border-white/[0.08] pt-4 text-xs">
                <span className="text-slate-400">Available on:</span>
                <div className="flex gap-2">
                  {content.providers?.length > 0 ? (
                    content.providers.map((p) => (
                      <span key={p.provider_id} className="rounded bg-white/5 border border-white/10 px-2.5 py-1 text-indigo-300 font-semibold">
                        {p.provider_name}
                      </span>
                    ))
                  ) : (
                    <span className="text-slate-500">Checking global provider catalog...</span>
                  )}
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // --- 10. TASTE CALIBRATION & ARCHETYPE MODAL ---
    function TasteCalibrationModal({ onClose, onArchetypeSelected }) {
      const archetypes = [
        {
          id: "cerebral",
          name: "The Cerebral Philosopher",
          tagline: "Mind-bending Sci-Fi, non-linear puzzles, existential mystery",
          hallmarks: ["Interstellar", "Arrival", "Dark", "Memento"],
          color: "from-indigo-600 to-blue-700"
        },
        {
          id: "comfort",
          name: "The Wholesome Cozy Seeker",
          tagline: "Gentle humor, heartwarming charm, zero anxiety, visual whimsy",
          hallmarks: ["Paddington 2", "Spirited Away", "Amélie", "Grand Budapest"],
          color: "from-amber-500 to-orange-600"
        },
        {
          id: "adrenaline",
          name: "The Pure Adrenaline Junkie",
          tagline: "High-octane action, kinetic stuntcraft, relentless momentum",
          hallmarks: ["Mad Max", "John Wick", "Top Gun", "The Dark Knight"],
          color: "from-rose-600 to-red-700"
        },
        {
          id: "emotional",
          name: "The Emotional Humanist",
          tagline: "Poignant character studies, profound love, tearjerking drama",
          hallmarks: ["Past Lives", "Portrait of a Lady on Fire", "Manchester by the Sea"],
          color: "from-purple-600 to-pink-700"
        },
        {
          id: "international",
          name: "The Global Auteur Explorer",
          tagline: "Bong Joon-ho, Park Chan-wook, French and Japanese cinematic craft",
          hallmarks: ["Parasite", "Memories of Murder", "Decision to Leave"],
          color: "from-teal-600 to-emerald-700"
        }
      ];

      const handleChoose = async (arch) => {
        try {
          await fetch(`${API_BASE}/profile/archetype`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ archetype: arch.id })
          });
          onArchetypeSelected(arch.name);
        } catch (e) {
          console.error(e);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto bg-black/85 backdrop-blur-md">
          <div className="relative w-full max-w-2xl rounded-2xl bg-surface border border-white/[0.12] p-6 sm:p-8 shadow-2xl">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 h-8 w-8 rounded-full bg-white/10 text-white flex items-center justify-center"
            >
              ✕
            </button>

            <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest">
              Machine Learning Calibration
            </span>
            <h2 className="text-2xl font-extrabold text-white mt-1">Select Your Cinephile Archetype</h2>
            <p className="text-xs text-slate-400 mt-1 leading-relaxed">
              Choosing an archetype instantly recalibrates your 20-dimensional taste vector, shifts your Taste Universe constellations, and re-ranks your discovery deck.
            </p>

            <div className="mt-6 space-y-3">
              {archetypes.map((arch) => (
                <div
                  key={arch.id}
                  onClick={() => handleChoose(arch)}
                  className="group flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl bg-white/[0.02] hover:bg-white/[0.06] border border-white/[0.08] hover:border-indigo-500/40 cursor-pointer transition-all gap-3"
                >
                  <div>
                    <h3 className="text-sm font-bold text-white group-hover:text-indigo-300 transition-colors">
                      {arch.name}
                    </h3>
                    <p className="text-xs text-slate-400 mt-0.5">{arch.tagline}</p>
                    <div className="flex gap-2 mt-2">
                      {arch.hallmarks.map((h, i) => (
                        <span key={i} className="text-[10px] bg-white/5 px-2 py-0.5 rounded text-slate-300">
                          {h}
                        </span>
                      ))}
                    </div>
                  </div>

                  <button className="shrink-0 rounded-lg bg-indigo-600 group-hover:bg-indigo-500 px-3.5 py-2 text-xs font-bold text-white shadow">
                    Select & Calibrate
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- 11. USER AUTHENTICATION MODAL (SIGN IN / REGISTER) ---
    function AuthModal({ onClose, onSuccess }) {
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [username, setUsername] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setLoading(true);

        const endpoint = isLoginMode ? `${API_BASE}/auth/login` : `${API_BASE}/auth/register`;
        const payload = isLoginMode
          ? { username_or_email: username, password }
          : { username, email, password };

        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) {
            setError(data.detail || "Authentication failed. Check credentials.");
          } else {
            onSuccess(data.user);
          }
        } catch (err) {
          setError("Network or server connection error.");
        }
        setLoading(false);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto bg-black/90 backdrop-blur-md">
          <div className="relative w-full max-w-md rounded-3xl bg-surface border border-white/[0.12] p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div className="absolute top-0 right-0 w-60 h-60 bg-amber-500/10 rounded-full blur-3xl pointer-events-none" />

            <button
              onClick={onClose}
              className="absolute top-4 right-4 h-8 w-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all"
            >
              ✕
            </button>

            <div className="flex items-center gap-2 mb-1">
              <span className="flex h-2 w-2 rounded-full bg-amber-400 animate-pulse" />
              <span className="text-[10px] font-black tracking-widest text-amber-400 uppercase">
                Secure Preference Identity
              </span>
            </div>
            <h2 className="text-2xl font-black text-white">
              {isLoginMode ? "Sign In to Your Taste Profile" : "Create Taste Profile"}
            </h2>
            <p className="text-xs text-slate-400 mt-1 leading-relaxed">
              {isLoginMode
                ? "Access your personalized 20-dimensional preference vector, saved watchlist, and custom calibrated archetypes."
                : "Join the platform to track and continuously train machine learning models on your viewing behavior."}
            </p>

            {error && (
              <div className="mt-4 p-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-xs font-semibold text-rose-300">
                ⚠ {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="mt-5 space-y-4 relative z-10">
              <div>
                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">
                  {isLoginMode ? "Username or Email" : "Choose Username"}
                </label>
                <input
                  type="text"
                  required
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  placeholder={isLoginMode ? "e.g. Cinephile Pioneer or user@example.com" : "e.g. film_buff_99"}
                  className="w-full rounded-xl border border-white/15 bg-black/60 px-4 py-3 text-sm text-white placeholder-slate-500 focus:border-amber-400 focus:outline-none transition-colors"
                />
              </div>

              {!isLoginMode && (
                <div>
                  <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">
                    Email Address
                  </label>
                  <input
                    type="email"
                    required
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="user@example.com"
                    className="w-full rounded-xl border border-white/15 bg-black/60 px-4 py-3 text-sm text-white placeholder-slate-500 focus:border-amber-400 focus:outline-none transition-colors"
                  />
                </div>
              )}

              <div>
                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">
                  Password
                </label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••••••"
                  className="w-full rounded-xl border border-white/15 bg-black/60 px-4 py-3 text-sm text-white placeholder-slate-500 focus:border-amber-400 focus:outline-none transition-colors"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full mt-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 py-3 text-xs font-black text-slate-950 shadow-xl shadow-amber-500/20 transition-all hover:scale-102 disabled:opacity-50"
              >
                {loading ? "Authenticating..." : (isLoginMode ? "Sign In & Load Vectors" : "Create Profile & Train Model")}
              </button>
            </form>

            <div className="mt-5 pt-4 border-t border-white/[0.08] text-center">
              <button
                onClick={() => { setIsLoginMode(!isLoginMode); setError(null); }}
                className="text-xs text-indigo-300 hover:text-white font-semibold transition-colors"
              >
                {isLoginMode ? "Don't have an account? Sign Up Free →" : "Already have an account? Sign In →"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
